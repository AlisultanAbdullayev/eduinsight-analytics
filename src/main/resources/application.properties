spring.application.name=EduInsight Analytics

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:eduinsight;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Connection pool (explicit sizing; avoids relying on Hikari's auto-detected defaults)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

# H2 console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Vaadin
vaadin.launch-browser=false

# Snowflake data warehouse integration (real JDBC client — see com.eduinsight.integration).
# Disabled by default: this demo ships with no live Snowflake account, so the Data Sources
# page honestly reports "Not Connected" instead of a fabricated "Active" badge. Fill these
# in and flip enabled=true to point it at a real warehouse.
eduinsight.integrations.snowflake.enabled=false
eduinsight.integrations.snowflake.account=
eduinsight.integrations.snowflake.user=
eduinsight.integrations.snowflake.password=
eduinsight.integrations.snowflake.warehouse=
eduinsight.integrations.snowflake.database=
eduinsight.integrations.snowflake.schema=

# Databricks AI/ML analytics integration (real JDBC client — see com.eduinsight.integration).
# Disabled by default for the same reason: no live Databricks workspace is provisioned for
# this demo.
eduinsight.integrations.databricks.enabled=false
eduinsight.integrations.databricks.host=
eduinsight.integrations.databricks.http-path=
eduinsight.integrations.databricks.token=
